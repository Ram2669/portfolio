[build]
  publish = "out"
  command = "npm run export"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Form success redirect
[[redirects]]
  from = "/contact"
  to = "/thank-you.html"
  status = 200
  conditions = {Role = ["form-submission"]}

# Enable Netlify Forms
[form]
  # Form settings for contact form
  [form.settings]
    # Send form submissions to your email
    [form.settings.notification]
      email = "ramgopalpampana120@gmail.com"


# Disable CDN/browser caching for resume files to ensure latest downloads
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/*.doc"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/*.docx"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
